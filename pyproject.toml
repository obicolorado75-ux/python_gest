[project]
name = "gestdepot"
version = "0.1.0"
description = "Gestion de dépôt de boissons — application hors ligne"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "argon2-cffi>=23.1",
    "qt-material>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
